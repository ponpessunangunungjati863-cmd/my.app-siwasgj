                                        <span>Unduh Foto Ini</span>
                                    </button>

                                    <button 
                                        onClick={() => window.open(previewPhoto, '_blank')}
                                        className="bg-slate-800 hover:bg-slate-700 text-slate-200 font-semibold py-3 px-4 rounded-xl transition text-xs border border-slate-700">
                                        <i className="fa-solid fa-up-right-from-square"></i> Ukuran Penuh
                                    </button>
                                </div>
                            </div>
                        )}
                    </div>
                );
            }

            return (
                <div className="flex-1 min-h-0 overflow-hidden flex flex-col bg-gray-50">
                    <SubHeader title="Folder Dokumentasi" onBack={goBack} />
                    <div className="flex-1 min-h-0 overflow-y-auto p-4 space-y-3">
                        <p className="text-xs text-gray-500 mb-2">Pilih folder kegiatan di bawah ini untuk melihat dan mengunduh galeri foto:</p>
                        {dokumentasi.length === 0 ? (
                            <div className="bg-white p-6 rounded-2xl border border-gray-100 text-center text-xs text-gray-500">
                                Belum ada dokumentasi kegiatan tersedia.
                            </div>
                        ) : (
                            dokumentasi.map(d => {
                                const list = d.fotoList || (d.foto ? [d.foto] : []);
                                const cover = list[0] || 'https://placehold.co/600x400/0a5c36/ffffff?text=Folder';
                                return (
                                    <div 
                                        key={d.id} 
                                        onClick={() => setSelectedFolderId(d.id)}
                                        className="bg-white p-3.5 rounded-2xl shadow-sm border border-gray-100 flex items-center gap-3.5 cursor-pointer hover:border-sg-green transition">
                                        <div className="w-16 h-16 rounded-xl overflow-hidden bg-gray-100 border border-gray-200 flex-shrink-0 relative">
                                            <img src={cover} alt="" className="w-full h-full object-cover" />
                                            <div className="absolute inset-0 bg-black/20 flex items-center justify-center text-white text-xs">
                                                <i className="fa-solid fa-folder-open"></i>
                                            </div>
                                        </div>
                                        <div className="flex-1 min-w-0">
                                            <h4 className="font-bold text-gray-800 text-sm truncate">{d.judul}</h4>
                                            <p className="text-[11px] text-gray-500 mt-0.5">{d.tanggal}</p>
                                            <span className="inline-block text-[10px] bg-emerald-50 text-sg-green font-bold px-2 py-0.5 rounded mt-1">
                                                <i className="fa-solid fa-images mr-1"></i> {list.length} Foto Tersedia
                                            </span>
                                        </div>
                                        <i className="fa-solid fa-chevron-right text-gray-400 text-xs pr-1"></i>
                                    </div>
                                );
                            })
                        )}
                    </div>
                </div>
            );
        };

        const WaliApp = ({
            student, studentsList, setStudentsList, pengumuman, dokumentasi, customLogo, contactInfo,
            syncToDatabase, showToast, onLogout, onOpenApkModal
        }) => {
            const [currentView, setCurrentView] = useState('beranda');
            const [absensiTab, setAbsensiTab] = useState('Semua');
            const [nilaiTab, setNilaiTab] = useState('Semua');

            const [showChangePass, setShowChangePass] = useState(false);
            const [oldPassInput, setOldPassInput] = useState('');
            const [newPassInput, setNewPassInput] = useState('');
            const [confirmPassInput, setConfirmPassInput] = useState('');
            const [showNewPassText, setShowNewPassText] = useState(false);
            const [passError, setPassError] = useState('');
            const [isChangingPass, setIsChangingPass] = useState(false);

            const handleChangeOwnPassword = async (e) => {
                e.preventDefault();
                setPassError('');

                if (!oldPassInput || !newPassInput || !confirmPassInput) {
                    setPassError('Semua kolom kata sandi wajib diisi.');
                    return;
                }
                if (newPassInput.length < 6) {
                    setPassError('Kata sandi baru minimal 6 karakter.');
                    return;
                }
                if (newPassInput !== confirmPassInput) {
                    setPassError('Konfirmasi kata sandi baru tidak cocok.');
                    return;
                }
                if (newPassInput === oldPassInput) {
                    setPassError('Kata sandi baru harus berbeda dengan sandi lama.');
                    return;
                }

                setIsChangingPass(true);
                try {
                    const user = window.FB.auth.currentUser;
                    if (!user || !user.email) throw new Error('Sesi pengguna tidak ditemukan.');

                    const credential = window.FB.EmailAuthProvider.credential(user.email, oldPassInput);
                    await window.FB.reauthenticateWithCredential(user, credential);
                    await window.FB.updatePassword(user, newPassInput);

                    const updatedStudents = studentsList.map(s =>
                        s.id === student.id ? { ...s, sandi: newPassInput } : s
                    );
                    setStudentsList(updatedStudents);
                    syncToDatabase({ studentsList: updatedStudents });

                    try {
                        await window.FB.set(window.FB.ref(window.FB.db, `siwasgj_reset_requests/${student.nis}`), null);
                    } catch (err) {}

                    setOldPassInput('');
                    setNewPassInput('');
                    setConfirmPassInput('');
                    setShowChangePass(false);
                    showToast('Kata sandi berhasil diperbarui!');
                } catch (err) {
                    if (err.code === 'auth/wrong-password' || err.code === 'auth/invalid-credential') {
                        setPassError('Kata sandi lama salah! Jika lupa sandi, keluar lalu gunakan menu Lupa Kata Sandi untuk direset pengurus.');
                    } else if (err.code === 'auth/requires-recent-login') {
                        setPassError('Sesi login terlalu lama. Silakan keluar lalu masuk kembali sebelum mengganti sandi.');
                    } else {
                        setPassError('Gagal mengganti sandi: ' + (err.message || 'Terjadi kesalahan.'));
                    }
                } finally {
                    setIsChangingPass(false);
                }
            };
            const navigateTo = (v) => setCurrentView(v);
            const goBack = () => setCurrentView('beranda');

            const [jenis, setJenis] = useState('');
            const [alasan, setAlasan] = useState('');
            const [tanggal, setTanggal] = useState('');

            const handleSubmitIzin = (e) => {
                e.preventDefault();
                if (!jenis || !alasan.trim() || !tanggal) return;
                const newItem = {
                    id: 'izin_' + Date.now(),
                    tanggal, jenis, alasan: alasan.trim(), status: 'Menunggu',
                    tglPengajuan: new Date().toLocaleDateString('id-ID', { day: 'numeric', month: 'short', year: 'numeric' })
                };

                const updatedStudents = studentsList.map(s => {
                    if (s.id === student.id) {
                        return { ...s, perizinan: [newItem, ...(s.perizinan || [])] };
                    }
                    return s;
                });
                setStudentsList(updatedStudents);
                syncToDatabase({ studentsList: updatedStudents });

                setJenis(''); setAlasan(''); setTanggal('');
                showToast("Pengajuan izin berhasil dikirim ke pengurus pondok real-time!");
            };

            const totalBelumLunas = (student.pembayaran || []).filter(p => p.status !== 'Lunas').reduce((sum, p) => {
                const num = parseInt((p.nominal || '').replace(/[^0-9]/g, '')) || 300000;
                return sum + num;
            }, 0);

            const contact = contactInfo || initialContactInfo;

            return (
                <div className="flex flex-col items-center justify-center min-h-[100dvh] bg-slate-950 p-0 sm:p-6">
                    <div className="w-full max-w-md bg-gray-50 h-[100dvh] sm:h-[844px] sm:rounded-[40px] relative app-container overflow-hidden flex flex-col sm:border-8 sm:border-slate-800 shadow-2xl">
                        <div className="bg-slate-900 text-slate-200 px-4 py-2 text-xs flex justify-between items-center flex-shrink-0 z-50">
                            <span className="flex items-center gap-1.5">
                                <span className="w-2 h-2 rounded-full bg-green-400 animate-pulse"></span>
                                Login Aktif (NIS: {student.nis})
                            </span>
                            <button onClick={onLogout} className="bg-red-600 hover:bg-red-700 text-white px-2.5 py-1 rounded text-[10px] font-bold">Keluar</button>
                        </div>

                        {currentView === 'beranda' && <WaliBeranda student={student} navigateTo={navigateTo} onOpenApkModal={onOpenApkModal} customLogo={customLogo} />}
                        {currentView === 'profil' && (
                            <div className="flex-1 min-h-0 overflow-hidden flex flex-col bg-white">
                                <SubHeader title="Profil Santri" onBack={goBack} />
                                <div className="flex-1 min-h-0 overflow-y-auto pb-8">
                                    <div className="bg-sg-green pt-6 pb-12 flex flex-col items-center rounded-b-[30px]">
                                        <div className="w-24 h-24 rounded-full border-4 border-white overflow-hidden mb-3 shadow-md">
                                            <img src={student.foto} alt="Profile" className="w-full h-full object-cover" />
                                        </div>
                                        <h2 className="text-white font-bold text-lg">{student.nama}</h2>
                                        <p className="text-sg-light text-sm opacity-90">Santri Aktif</p>
                                    </div>
                                    <div className="px-5 -mt-6 space-y-4">
                                        <div className="bg-white rounded-xl shadow-lg border border-gray-100 p-2">
                                            <ProfileItem icon="fa-user" label="Nama Santri" value={student.nama} />
                                            <ProfileItem icon="fa-id-card" label="NIS" value={student.nis} />
                                            <ProfileItem icon="fa-map-marker-alt" label="Tempat, Tgl Lahir" value={`${student.tempatLahir || '-'}, ${student.tglLahir || '-'}`} />
                                            <ProfileItem icon="fa-school" label="Kelas" value={student.kelas} />
                                            <ProfileItem icon="fa-bed" label="Kamar" value={student.kamar} />
                                            <ProfileItem icon="fa-user-tie" label="Nama Wali" value={student.namaWali} />
                                            <ProfileItem icon="fa-phone" label="No. HP Wali" value={student.noHpWali} noBorder />
                                        </div>
                                        <div className="bg-white rounded-xl shadow-sm border border-gray-100 p-4">
                                            <div className="flex items-center justify-between">
                                                <div className="flex items-center gap-2.5">
                                                    <div className="w-8 h-8 rounded-lg bg-amber-50 text-amber-600 flex items-center justify-center text-xs">
                                                        <i className="fa-solid fa-key"></i>
                                                    </div>
                                                    <div>
                                                        <h4 className="text-xs font-bold text-gray-800">Keamanan Akun Wali</h4>
                                                        <p className="text-[10px] text-gray-500">Ganti kata sandi login Anda sendiri</p>
                                                    </div>
                                                </div>
                                                <button
                                                    type="button"
                                                    onClick={() => { setShowChangePass(!showChangePass); setPassError(''); }}
                                                    className="bg-sg-light hover:bg-emerald-100 text-sg-green text-[11px] font-bold px-3 py-1.5 rounded-lg transition">
                                                    {showChangePass ? 'Tutup' : 'Ganti Sandi'}
                                                </button>
                                            </div>

                                            {showChangePass && (
                                                <form onSubmit={handleChangeOwnPassword} className="mt-4 pt-3 border-t border-gray-100 space-y-3">
                                                    <div>
                                                        <label className="text-[11px] font-semibold text-gray-600 block mb-1">Kata Sandi Lama</label>
                                                        <input
                                                            type={showNewPassText ? 'text' : 'password'}
                                                            value={oldPassInput}
                                                            onChange={(e) => setOldPassInput(e.target.value)}
                                                            placeholder="Masukkan sandi saat ini..."
                                                            className="w-full bg-gray-50 border border-gray-300 rounded-lg p-2.5 text-xs focus:outline-none focus:border-sg-green"
                                                            required
                                                        />
                                                    </div>
                                                    <div>
                                                        <label className="text-[11px] font-semibold text-gray-600 block mb-1">Kata Sandi Baru (Min. 6 Karakter)</label>
                                                        <input
                                                            type={showNewPassText ? 'text' : 'password'}
                                                            value={newPassInput}
                                                            onChange={(e) => setNewPassInput(e.target.value)}
                                                            placeholder="Buat kata sandi baru..."
                                                            className="w-full bg-gray-50 border border-gray-300 rounded-lg p-2.5 text-xs focus:outline-none focus:border-sg-green"
                                                            required
                                                        />
                                                    </div>
                                                    <div>
                                                        <label className="text-[11px] font-semibold text-gray-600 block mb-1">Konfirmasi Kata Sandi Baru</label>
                                                        <input
                                                            type={showNewPassText ? 'text' : 'password'}
                                                            value={confirmPassInput}
                                                            onChange={(e) => setConfirmPassInput(e.target.value)}
                                                            placeholder="Ulangi kata sandi baru..."
                                                            className="w-full bg-gray-50 border border-gray-300 rounded-lg p-2.5 text-xs focus:outline-none focus:border-sg-green"
                                                            required
                                                        />
                                                    </div>
                                                    <label className="flex items-center gap-2 text-[11px] text-gray-500 cursor-pointer">
                                                        <input
                                                            type="checkbox"
                                                            checked={showNewPassText}
                                                            onChange={(e) => setShowNewPassText(e.target.checked)}
                                                            className="rounded text-sg-green"
                                                        />
                                                        <span>Tampilkan kata sandi</span>
                                                    </label>
                                                    {passError && (
                                                        <div className="p-2.5 bg-red-50 border border-red-200 rounded-lg text-red-600 text-[11px]">
                                                            {passError}
                                                        </div>
                                                    )}
                                                    <button
                                                        type="submit"
                                                        disabled={isChangingPass}
                                                        className="w-full bg-sg-green hover:bg-sg-dark text-white font-bold py-2.5 rounded-xl text-xs transition shadow-sm">
                                                        {isChangingPass ? 'Menyimpan...' : 'Simpan Kata Sandi Baru'}
                                                    </button>
                                                    <p className="text-[10px] text-gray-400 text-center">
                                                        Catatan: Jika lupa kata sandi, silakan hubungi pengurus pondok untuk direset.
                                                    </p>
                                                </form>
                                            )}
                                        </div>

                                        <button onClick={onLogout} className="w-full bg-red-50 hover:bg-red-100 text-red-600 border border-red-200 font-semibold py-3 rounded-xl transition text-xs flex items-center justify-center gap-2">
                                            <i className="fa-solid fa-right-from-bracket"></i> Keluar dari Akun Wali
                                        </button>
                                    </div>
                                </div>
                            </div>
                        )}
                        {currentView === 'pembayaran' && (
                            <div className="flex-1 min-h-0 overflow-hidden flex flex-col bg-gray-50">
                                <SubHeader title="Tagihan & Pembayaran" onBack={goBack} />
                                <div className="flex-1 min-h-0 overflow-y-auto p-5">
                                    <div className="bg-white rounded-xl shadow-sm border border-red-100 p-5 mb-6 flex items-center justify-between">
                                        <div>
                                            <p className="text-xs text-gray-500 mb-1">Total Tagihan Belum Lunas</p>
                                            <p className="text-2xl font-bold text-red-600">Rp{totalBelumLunas.toLocaleString('id-ID')}</p>
                                        </div>
                                    </div>
                                    <h3 className="font-semibold text-gray-800 mb-4">Riwayat Tagihan & SPP</h3>
                                    <div className="bg-white rounded-xl shadow-sm border border-gray-100 overflow-hidden">
                                        {student.pembayaran && student.pembayaran.length > 0 ? (
                                            student.pembayaran.map((item, index) => (
                                                <div key={item.id || index} className={`flex justify-between items-center p-4 ${index !== student.pembayaran.length - 1 ? 'border-b border-gray-100' : ''}`}>
                                                    <span className="text-sm font-medium text-gray-700">{item.bulan}</span>
                                                    <div className="flex items-center gap-3">
                                                        <span className={`text-[10px] font-bold px-2.5 py-1 rounded-full ${item.status === 'Lunas' ? 'bg-green-100 text-green-700' : 'bg-red-100 text-red-700'}`}>{item.status}</span>
                                                        <span className="text-sm font-semibold text-gray-800 w-24 text-right">{item.nominal}</span>
                                                    </div>
                                                </div>
                                            ))
                                        ) : (
                                            <p className="p-4 text-xs text-gray-500 text-center">Belum ada tagihan.</p>
                                        )}
                                    </div>
                                </div>
                            </div>
                        )}
                        {currentView === 'pengumuman' && (
                            <div className="flex-1 min-h-0 overflow-hidden flex flex-col bg-gray-50">
                                <SubHeader title="Pengumuman" onBack={goBack} />
                                <div className="flex-1 min-h-0 overflow-y-auto p-4 space-y-4">
                                    {pengumuman.length === 0 ? (
                                        <div className="bg-white p-6 rounded-xl border border-gray-100 text-center text-xs text-gray-500">
                                            Belum ada pengumuman terbaru.
                                        </div>
                                    ) : (
                                        pengumuman.map(item => (
                                            <div key={item.id} className="bg-white p-4 rounded-xl shadow-sm border border-gray-100 flex gap-4">
                                                <div className={`w-10 h-10 rounded-full flex items-center justify-center flex-shrink-0 ${item.bg || 'bg-teal-100'} ${item.color || 'text-teal-600'}`}>
                                                    <i className={`fa-solid ${item.icon || 'fa-bullhorn'}`}></i>
                                                </div>
                                                <div>
                                                    <h4 className="font-semibold text-gray-800 text-sm mb-1">{item.title}</h4>
                                                    <p className="text-xs text-gray-600 leading-relaxed mb-2">{item.desc}</p>
                                                    <span className="text-[10px] text-gray-400 font-medium">{item.date}</span>
                                                </div>
                                            </div>
                                        ))
                                    )}
                                </div>
                            </div>
                        )}
                        {currentView === 'nilai' && (() => {
                            const allNilai = student.nilai || [];
                            const filteredNilai = allNilai.filter(item => {
                                const kat = item.kategori || 'Pondok';
                                return nilaiTab === 'Semua' || kat === nilaiTab;
                            });
                            const rataRata = filteredNilai.length > 0
                                ? (filteredNilai.reduce((sum, i) => sum + (Number(i.nilai) || 0), 0) / filteredNilai.length).toFixed(1)
                                : '-';

                            return (
                                <div className="flex-1 min-h-0 overflow-hidden flex flex-col bg-gray-50">
                                    <SubHeader title="Nilai Pondok, SMP & SMK" onBack={goBack} />
                                    <div className="flex-1 min-h-0 overflow-y-auto p-4 space-y-3">
                                        <div className="grid grid-cols-4 gap-1.5 bg-white p-1.5 rounded-xl shadow-sm border border-gray-100">
                                            {['Semua', 'Pondok', 'SMP', 'SMK'].map(tab => (
                                                <button
                                                    key={tab}
                                                    onClick={() => setNilaiTab(tab)}
                                                    className={`py-2 rounded-lg text-xs font-bold transition ${
                                                        nilaiTab === tab ? 'bg-sg-green text-white shadow-sm' : 'text-gray-600 hover:bg-gray-100'
                                                    }`}>
                                                    {tab}
                                                </button>
                                            ))}
                                        </div>

                                        <div className="grid grid-cols-2 gap-2.5">
                                            <div className="bg-white border border-gray-100 rounded-xl p-3 shadow-sm">
                                                <span className="text-[10px] text-gray-400 block">Jumlah Mapel ({nilaiTab})</span>
                                                <span className="text-base font-black text-gray-800">{filteredNilai.length} Mapel</span>
                                            </div>
                                            <div className="bg-emerald-50 border border-emerald-100 rounded-xl p-3 shadow-sm">
                                                <span className="text-[10px] text-emerald-700 block">Rata-rata Nilai</span>
                                                <span className="text-base font-black text-sg-green">{rataRata}</span>
                                            </div>
                                        </div>

                                        <div className="bg-white rounded-xl shadow-sm border border-gray-100 overflow-hidden">
                                            {filteredNilai.length > 0 ? (
                                                filteredNilai.map((item, index) => {
                                                    const kat = item.kategori || 'Pondok';
                                                    return (
                                                        <div key={item.id || index} className={`flex justify-between items-center p-3.5 ${index !== filteredNilai.length - 1 ? 'border-b border-gray-50' : ''}`}>
                                                            <div className="pr-2">
                                                                <div className="flex items-center gap-2 flex-wrap">
                                                                    <span className={`text-[9px] font-bold px-2 py-0.5 rounded ${
                                                                        kat === 'Pondok' ? 'bg-emerald-100 text-emerald-700' :
                                                                        kat === 'SMP' ? 'bg-sky-100 text-sky-700' :
                                                                        'bg-purple-100 text-purple-700'
                                                                    }`}>{kat}</span>
                                                                    <span className="text-sm font-medium text-gray-800">{item.mapel}</span>
                                                                </div>
                                                                {item.keterangan && <p className="text-[11px] text-gray-400 mt-0.5">{item.keterangan}</p>}
                                                            </div>
                                                            <span className="text-sm font-black text-sg-green bg-sg-light px-3 py-1 rounded-lg min-w-[44px] text-center">{item.nilai}</span>
                                                        </div>
                                                    );
                                                })
                                            ) : (
                                                <p className="p-4 text-xs text-gray-500 text-center">Belum ada data nilai untuk kategori {nilaiTab}.</p>
                                            )}
                                        </div>
                                    </div>
                                </div>
                            );
                        })()}
                        {currentView === 'absensi' && (() => {
                            const allAbsensi = student.absensi || [];
                            const filteredAbsensi = allAbsensi.filter(item => {
                                const kat = item.kategori || 'Pondok';
                                return absensiTab === 'Semua' || kat === absensiTab;
                            });
                            const countStatus = (st) => filteredAbsensi.filter(i => i.status === st).length;

                            return (
                                <div className="flex-1 min-h-0 overflow-hidden flex flex-col bg-gray-50">
                                    <SubHeader title="Absensi Pondok, SMP & SMK" onBack={goBack} />
                                    <div className="flex-1 min-h-0 overflow-y-auto p-4 space-y-3">
                                        <div className="grid grid-cols-4 gap-1.5 bg-white p-1.5 rounded-xl shadow-sm border border-gray-100">
                                            {['Semua', 'Pondok', 'SMP', 'SMK'].map(tab => (
                                                <button
                                                    key={tab}
                                                    onClick={() => setAbsensiTab(tab)}
                                                    className={`py-2 rounded-lg text-xs font-bold transition ${
                                                        absensiTab === tab ? 'bg-sg-green text-white shadow-sm' : 'text-gray-600 hover:bg-gray-100'
                                                    }`}>
                                                    {tab}
                                                </button>
                                            ))}
                                        </div>

                                        <div className="grid grid-cols-4 gap-2">
                                            <div className="bg-green-50 border border-green-100 rounded-xl p-2.5 text-center">
                                                <span className="text-sm font-black text-green-700 block">{countStatus('Hadir')}</span>
                                                <span className="text-[10px] font-semibold text-green-600">Hadir</span>
                                            </div>
                                            <div className="bg-amber-50 border border-amber-100 rounded-xl p-2.5 text-center">
                                                <span className="text-sm font-black text-amber-700 block">{countStatus('Izin')}</span>
                                                <span className="text-[10px] font-semibold text-amber-600">Izin</span>
                                            </div>
                                            <div className="bg-sky-50 border border-sky-100 rounded-xl p-2.5 text-center">
                                                <span className="text-sm font-black text-sky-700 block">{countStatus('Sakit')}</span>
                                                <span className="text-[10px] font-semibold text-sky-600">Sakit</span>
                                            </div>
                                            <div className="bg-red-50 border border-red-100 rounded-xl p-2.5 text-center">
                                                <span className="text-sm font-black text-red-700 block">{countStatus('Alpha')}</span>
                                                <span className="text-[10px] font-semibold text-red-600">Alpha</span>
                                            </div>
                                        </div>

                                        <div className="bg-white rounded-xl shadow-sm border border-gray-100 overflow-hidden">
                                            {filteredAbsensi.length > 0 ? (
                                                filteredAbsensi.map((item, index) => {
                                                    const kat = item.kategori || 'Pondok';
                                                    return (
                                                        <div key={item.id || index} className={`flex justify-between items-center p-3 ${index !== filteredAbsensi.length - 1 ? 'border-b border-gray-50' : ''}`}>

                                                                <div className="flex items-center gap-2">
                                                                    <span className={`text-[9px] font-bold px-2 py-0.5 rounded ${
                                                                        kat === 'Pondok' ? 'bg-emerald-100 text-emerald-700' :
                                                                        kat === 'SMP' ? 'bg-sky-100 text-sky-700' :
                                                                        'bg-purple-100 text-purple-700'
                                                                    }`}>{kat}</span>
                                                                    <span className="text-sm text-gray-700 font-medium">{item.tanggal}</span>
                                                                </div>
                                                                {item.keterangan && <p className="text-[11px] text-gray-400 mt-0.5">{item.keterangan}</p>}
                                                            </div>
                                                            <span className={`text-[10px] font-bold px-3 py-1 rounded-full ${
                                                                item.status === 'Hadir' ? 'bg-green-100 text-green-700' :
                                                                item.status === 'Izin' ? 'bg-amber-100 text-amber-700' :
                                                                item.status === 'Sakit' ? 'bg-sky-100 text-sky-700' : 'bg-red-100 text-red-700'
                                                            }`}>{item.status}</span>
                                                        </div>
                                                    );
                                                })
                                            ) : (
                                                <p className="p-4 text-xs text-gray-500 text-center">Belum ada riwayat absensi untuk kategori {absensiTab}.</p>
                                            )}
                                        </div>
                                    </div>
                                </div>
                            );
                        })()}
                        {currentView === 'perizinan' && (
                            <div className="flex-1 min-h-0 overflow-hidden flex flex-col bg-gray-50">
                                <SubHeader title="Perizinan Santri" onBack={goBack} />
                                <div className="flex-1 min-h-0 overflow-y-auto p-4 space-y-6">
                                    <div className="bg-white p-5 rounded-xl border border-gray-100 shadow-sm">
                                        <h3 className="font-bold text-gray-800 mb-3">Form Ajukan Izin</h3>
                                        <form onSubmit={handleSubmitIzin} className="space-y-3">
                                            <div>
                                                <label className="text-xs font-semibold text-gray-600 block mb-1">Tanggal Izin</label>
                                                <input type="date" value={tanggal} onChange={(e) => setTanggal(e.target.value)} className="w-full bg-gray-50 border border-gray-300 rounded-lg p-2.5 text-sm" required />
                                            </div>
                                            <div>
                                                <label className="text-xs font-semibold text-gray-600 block mb-1">Jenis Izin</label>
                                                <select value={jenis} onChange={(e) => setJenis(e.target.value)} className="w-full bg-gray-50 border border-gray-300 rounded-lg p-2.5 text-sm" required>
                                                    <option value="">Pilih izin</option>
                                                    <option value="Sakit">Sakit</option>
                                                    <option value="Pulang">Pulang / Keluarga</option>
                                                </select>
                                            </div>
                                            <div>
                                                <label className="text-xs font-semibold text-gray-600 block mb-1">Alasan</label>
                                                <textarea rows="3" value={alasan} onChange={(e) => setAlasan(e.target.value)} className="w-full bg-gray-50 border border-gray-300 rounded-lg p-2.5 text-sm resize-none" required></textarea>
                                            </div>
                                            <button type="submit" className="w-full bg-sg-green text-white font-semibold py-2.5 rounded-xl">Kirim Pengajuan</button>
                                        </form>
                                    </div>

                                    <div className="bg-white p-5 rounded-xl border border-gray-100 shadow-sm">
                                        <h3 className="font-bold text-gray-800 mb-3">Riwayat Pengajuan Izin</h3>
                                        <div className="space-y-3">
                                            {student.perizinan && student.perizinan.length > 0 ? (
                                                student.perizinan.map((item, index) => (
                                                    <div key={item.id || index} className="p-3 bg-gray-50 rounded-lg border border-gray-100 space-y-1">
                                                        <div className="flex justify-between items-center">
                                                            <span className="text-xs font-bold text-sg-green">{item.jenis}</span>
                                                            <span className={`text-[10px] px-2 py-0.5 rounded font-bold ${
                                                                item.status === 'Disetujui' ? 'bg-green-100 text-green-700' :
                                                                item.status === 'Ditolak' ? 'bg-red-100 text-red-700' : 'bg-amber-100 text-amber-700'
                                                            }`}>{item.status}</span>
                                                        </div>
                                                        <p className="text-xs text-gray-700">{item.alasan}</p>
                                                        <span className="text-[10px] text-gray-400 block">Tanggal: {item.tanggal}</span>
                                                    </div>
                                                ))
                                            ) : (
                                                <p className="text-xs text-gray-500 text-center py-2">Belum ada riwayat perizinan.</p>
                                            )}
                                        </div>
                                    </div>
                                </div>
                            </div>
                        )}
                        {currentView === 'dokumentasi' && (
                            <WaliDokumentasiView dokumentasi={dokumentasi} goBack={goBack} showToast={showToast} />
                        )}
                        {currentView === 'hubungi' && (
                            <div className="flex-1 min-h-0 overflow-hidden flex flex-col bg-gray-50">
                                <SubHeader title="Hubungi Pondok & Sharelok" onBack={goBack} />
                                <div className="flex-1 min-h-0 overflow-y-auto p-5 space-y-4">
                                    <div className="bg-white rounded-xl shadow-sm border border-gray-100 p-5 space-y-4 text-sm">
                                        <div className="flex items-center gap-3">
                                            <div className="w-9 h-9 bg-green-50 text-sg-green rounded-full flex items-center justify-center flex-shrink-0">
                                                <i className="fa-solid fa-phone"></i>
                                            </div>
                                            <div className="flex-1">
                                                <p className="text-xs text-gray-400">Telepon Pesantren</p>
                                                <p className="font-semibold text-gray-800">{contact.telepon}</p>
                                            </div>
                                            <a href={`tel:${(contact.telepon || '').replace(/[^0-9+]/g, '')}`} className="bg-sg-green text-white text-xs px-3 py-1.5 rounded-lg font-bold">Telepon</a>
                                        </div>

                                        <div className="flex items-center gap-3 border-t border-gray-100 pt-3">
                                            <div className="w-9 h-9 bg-green-50 text-sg-green rounded-full flex items-center justify-center flex-shrink-0">
                                                <i className="fa-brands fa-whatsapp text-lg"></i>
                                            </div>
                                            <div className="flex-1">
                                                <p className="text-xs text-gray-400">WhatsApp Resmi</p>
                                                <p className="font-semibold text-gray-800">{contact.whatsapp}</p>
                                            </div>
                                            <a href={`https://wa.me/${(contact.whatsapp || '').replace(/[^0-9]/g, '').replace(/^0/, '62')}`} target="_blank" rel="noopener noreferrer" className="bg-emerald-600 text-white text-xs px-3 py-1.5 rounded-lg font-bold">Chat WA</a>
                                        </div>

                                        <div className="flex items-center gap-3 border-t border-gray-100 pt-3">
                                            <div className="w-9 h-9 bg-green-50 text-sg-green rounded-full flex items-center justify-center flex-shrink-0">
                                                <i className="fa-solid fa-map-marker-alt"></i>
                                            </div>
                                            <div className="flex-1">
                                                <p className="text-xs text-gray-400">Alamat & Titik Sharelok</p>
                                                <p className="font-semibold text-gray-800 text-xs leading-relaxed">{contact.alamat}</p>
                                            </div>
                                            <a href={contact.mapsUrl} target="_blank" rel="noopener noreferrer" className="bg-blue-600 text-white text-xs px-3 py-1.5 rounded-lg font-bold flex items-center gap-1">
                                                <i className="fa-solid fa-location-dot"></i> Maps
                                            </a>
                                        </div>
                                    </div>
                                </div>
                            </div>
                        )}

                        <div className="bg-white border-t border-gray-100 rounded-t-2xl px-6 py-2.5 flex justify-between items-center flex-shrink-0 z-30">
                            <button onClick={() => setCurrentView('beranda')} className={`flex flex-col items-center p-1.5 ${currentView === 'beranda' ? 'text-sg-green font-bold' : 'text-gray-400'}`}>
                                <i className="fa-solid fa-home text-lg mb-0.5"></i><span className="text-[10px]">Beranda</span>
                            </button>
                            <button onClick={() => setCurrentView('profil')} className={`flex flex-col items-center p-1.5 ${currentView === 'profil' ? 'text-sg-green font-bold' : 'text-gray-400'}`}>
                                <i className="fa-regular fa-user text-lg mb-0.5"></i><span className="text-[10px]">Akun</span>
                            </button>
                        </div>
                    </div>
                </div>
            );
        };

        const App = () => {
            const [fbReady, setFbReady] = useState(Boolean(window.FB));
            const [isLoggedIn, setIsLoggedIn] = useState(false);
            const [role, setRole] = useState('wali');
            const [adminUser, setAdminUser] = useState(null);
            const [activeStudentId, setActiveStudentId] = useState(initialStudentsList[0].id);
            const [showApkModal, setShowApkModal] = useState(false);
            const [showSecretModal, setShowSecretModal] = useState(false);
            const [isOnline, setIsOnline] = useState(true);

            const [activeTabOperator, setActiveTabOperator] = useState('admins');
            const [studentsList, setStudentsList] = useState(initialStudentsList.map(normalizeStudent));
            const [adminUsers, setAdminUsers] = useState(initialAdminUsers);
            const [pengumuman, setPengumuman] = useState(initialPengumuman);
            const [dokumentasi, setDokumentasi] = useState(initialDokumentasi);
            const [contactInfo, setContactInfo] = useState(initialContactInfo);
            const [customLogo, setCustomLogo] = useState('');

            const [toastMessage, setToastMessage] = useState(null);

            const showToast = (msg) => {
                setToastMessage(msg);
                setTimeout(() => setToastMessage(null), 3500);
            };

            useEffect(() => {
                if (window.FB) {
                    setFbReady(true);
                    return;
                }
                const onReady = () => setFbReady(true);
                window.addEventListener('fb-ready', onReady);
                return () => window.removeEventListener('fb-ready', onReady);
            }, []);

            useEffect(() => {
                if (!fbReady || !window.FB) return;

                let unsubDb = null;

                const unsubAuth = window.FB.onAuthStateChanged(window.FB.auth, (user) => {
                    if (unsubDb) {
                        unsubDb();
                        unsubDb = null;
                    }

                    if (user) {
                        const dbRef = window.FB.ref(window.FB.db, "siwasgj_data");
                        unsubDb = window.FB.onValue(dbRef, (snapshot) => {
                            const data = snapshot.val();
                            
                            let currentAdminUsers = initialAdminUsers;
                            let currentStudentsList = initialStudentsList.map(normalizeStudent);
                            
                            if (data) {
                                currentStudentsList = Array.isArray(data.studentsList)
                                    ? data.studentsList.map(normalizeStudent)
                                    : [];
                                setStudentsList(currentStudentsList);

                                currentAdminUsers = Array.isArray(data.adminUsers)
                                    ? data.adminUsers
                                    : initialAdminUsers;
                                setAdminUsers(currentAdminUsers);

                                setPengumuman(Array.isArray(data.pengumuman) ? data.pengumuman : []);
                                setDokumentasi(Array.isArray(data.dokumentasi) ? data.dokumentasi : []);
                                setContactInfo(data.contactInfo || initialContactInfo);
                                setCustomLogo(data.customLogo !== undefined ? data.customLogo : '');
                                setIsOnline(true);
                            } else {
                                window.FB.set(dbRef, {
                                    studentsList: currentStudentsList,
                                    adminUsers: initialAdminUsers,
                                    pengumuman: initialPengumuman,
                                    dokumentasi: initialDokumentasi,
                                    contactInfo: initialContactInfo,
                                    customLogo: ''
                                });
                            }

                            const prefix = (user.email || '').split('@')[0].trim().toLowerCase();
                            const foundAdmin = currentAdminUsers.find(a => String(a.username || '').trim().toLowerCase() === prefix);
                            
                            if (foundAdmin) {
                                setRole('operator'); 
                                setAdminUser(prev => {
                                    if (!prev || prev.id !== foundAdmin.id) {
                                        if (foundAdmin.role === 'superadmin') setActiveTabOperator('admins');
                                        else if (foundAdmin.role === 'bendahara') setActiveTabOperator('pembayaran');
                                        else if (foundAdmin.role === 'media') setActiveTabOperator('logo');
                                        else if (foundAdmin.role === 'sekretaris') setActiveTabOperator('santri');
                                        else if (foundAdmin.role === 'absensi_smp' || foundAdmin.role === 'absensi_smk') setActiveTabOperator('absensi');
                                        else if (foundAdmin.role === 'guru_smp' || foundAdmin.role === 'guru_smk') setActiveTabOperator('nilai');
                                    }
                                    return foundAdmin;
                                });
                                setIsLoggedIn(true);
                            } else {
                                const foundStudent = currentStudentsList.find(s => String(s.nis || '').trim().toLowerCase() === prefix);
                                if (foundStudent) {
                                    setRole('wali'); 
                                    setActiveStudentId(foundStudent.id); 
                                    setIsLoggedIn(true);
                                } else {
                                    setIsLoggedIn(false);
                                    setAdminUser(null);
                                    window.FB.signOut(window.FB.auth);
                                    showToast("Akun tidak ditemukan di database aktif. Hubungi pengurus.");
                                }
                            }
                        }, (err) => {
                            setIsOnline(false);
                            showToast("Gagal mengambil data: " + err.message);
                        });
                    } else {
                        setIsLoggedIn(false);
                        setAdminUser(null);
                    }
                });
                
                return () => {
                    if (unsubDb) unsubDb();
                    unsubAuth();
                };
            }, [fbReady]);

            const syncToDatabase = async (updatedFields) => {
                try {
                    const dbRef = window.FB.ref(window.FB.db, "siwasgj_data");
                    await window.FB.update(dbRef, updatedFields);
                    setIsOnline(true);
                } catch (err) {
                    setIsOnline(false);
                    showToast("Gagal menyinkronkan data ke server (Offline).");
                }
            };

            const handleLogout = () => {
                if (window.FB) window.FB.signOut(window.FB.auth);
                setIsLoggedIn(false);
                setAdminUser(null);
                showToast("Anda telah keluar dengan aman.");
            };

            const activeStudent = studentsList.find(s => s.id === activeStudentId) || studentsList[0];

            return (
                <React.Fragment>
                    <div className={`fixed bottom-4 left-4 z-[9999] px-3 py-1.5 rounded-full text-[10px] font-bold flex items-center gap-2 shadow-lg pointer-events-none ${isOnline && fbReady ? 'bg-emerald-500 text-white' : 'bg-red-500 text-white'}`}>
                        <span className="w-2 h-2 rounded-full bg-white animate-pulse"></span>
                        {!fbReady ? "MEMUAT SERVER..." : isOnline ? "TERHUBUNG (Firebase Auth V2)" : "OFFLINE / GAGAL"}
                    </div>

                    {toastMessage && (
                        <div className="fixed top-5 right-5 left-5 sm:left-auto z-[9999] bg-slate-800 border border-slate-700 text-white text-xs px-4 py-3 rounded-xl shadow-2xl flex items-center gap-3">
                            <i className="fa-solid fa-circle-check text-sg-green text-base flex-shrink-0"></i>
                            <span>{toastMessage}</span>
                        </div>
                    )}

                    {showApkModal && <ApkDownloadModal onClose={() => setShowApkModal(false)} showToast={showToast} customLogo={customLogo} studentsList={studentsList} pengumuman={pengumuman} adminUsers={adminUsers} />}
                    {showSecretModal && <SecretInfoModal onClose={() => setShowSecretModal(false)} />}

                    {!isLoggedIn ? (
                        <LoginScreen 
                            onOpenApkModal={() => setShowApkModal(true)} 
                            onOpenSecret={() => setShowSecretModal(true)} 
                            customLogo={customLogo}
                            contactInfo={contactInfo}
                            showToast={showToast}
                            fbReady={fbReady}
                        />
                    ) : role === 'operator' && adminUser ? (
                        <OperatorPanel 
                            activeTabOperator={activeTabOperator}
                            setActiveTabOperator={setActiveTabOperator}
                            studentsList={studentsList}
                            setStudentsList={setStudentsList}
                            pengumuman={pengumuman}
                            setPengumuman={setPengumuman}
                            dokumentasi={dokumentasi}
                            setDokumentasi={setDokumentasi}
                            adminUsers={adminUsers}
                            setAdminUsers={setAdminUsers}
                            customLogo={customLogo}
                            setCustomLogo={setCustomLogo}
                            contactInfo={contactInfo}
                            setContactInfo={setContactInfo}
                            syncToDatabase={syncToDatabase}
                            onLogout={handleLogout}
                            showToast={showToast}
                            adminUser={adminUser}
                        />
                    ) : activeStudent ? (
                        <WaliApp 
                            student={activeStudent}
                            studentsList={studentsList}
                            setStudentsList={setStudentsList}
                            pengumuman={pengumuman}
                            dokumentasi={dokumentasi}
                            customLogo={customLogo}
                            contactInfo={contactInfo}
                            syncToDatabase={syncToDatabase}
                            showToast={showToast}
                            onLogout={handleLogout}
                            onOpenApkModal={() => setShowApkModal(true)}
                        />
                    ) : null}
                </React.Fragment>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
