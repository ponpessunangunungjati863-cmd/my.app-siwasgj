        const createAuthUser = async (email, password) => {
            const res = await fetch(`https://identitytoolkit.googleapis.com/v1/accounts:signUp?key=${window.FIREBASE_API_KEY}`, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ email, password, returnSecureToken: false })
            });
            const data = await res.json();
            if (data.error) throw new Error(data.error.message);
            return data;
        };

        const handleDownloadPhoto = async (photoUrl, photoName = "Dokumentasi_SIWASGJ.jpg") => {
            try {
                const response = await fetch(photoUrl);
                const blob = await response.blob();
                const url = window.URL.createObjectURL(blob);
                const link = document.createElement('a');
                link.href = url;
                link.download = photoName;
                document.body.appendChild(link);
                link.click();
                document.body.removeChild(link);
                window.URL.revokeObjectURL(url);
            } catch (error) {
                window.open(photoUrl, '_blank');
            }
        };

                setIsSubmittingReset(true);

                        nis: cleanNis,
                        nama: forgotNama.trim() || '-',

                    });

                } finally {

        const OperatorDokumentasiManager = ({ dokumentasi, setDokumentasi, syncToDatabase, showToast }) => {
            const [judul, setJudul] = useState('');
            const [newFolderFotos, setNewFolderFotos] = useState([]);
            const [addPhotoTargetId, setAddPhotoTargetId] = useState(null);
            const [extraFotos, setExtraFotos] = useState([]);
            const newFileInputRef = useRef(null);

            const handleFilesToDataUrls = (files, onComplete) => {
                const fileArray = Array.from(files || []);
                if (fileArray.length === 0) return;
                let processed = 0;
                const dataUrls = new Array(fileArray.length).fill(null);

                const finishOne = () => {
                    processed++;
                    if (processed === fileArray.length) {
                        onComplete(dataUrls.filter(Boolean));
                    }
                };

                fileArray.forEach((file, idx) => {
                    const reader = new FileReader();
                    reader.onerror = finishOne;
                    reader.onloadend = () => {
                        const img = new Image();
                        img.onerror = finishOne;
                        img.onload = () => {
                            const canvas = document.createElement('canvas');
                            const MAX_WIDTH = 800, MAX_HEIGHT = 800;
                            let width = img.width, height = img.height;
                            if (width > height) {
                                if (width > MAX_WIDTH) { height *= MAX_WIDTH / width; width = MAX_WIDTH; }
                            } else {
                                if (height > MAX_HEIGHT) { width *= MAX_HEIGHT / height; height = MAX_HEIGHT; }
                            }
                            canvas.width = width; canvas.height = height;
                            const ctx = canvas.getContext('2d');
                            ctx.drawImage(img, 0, 0, width, height);
                            dataUrls[idx] = canvas.toDataURL('image/jpeg', 0.6);
                            finishOne();
                        };
                        img.src = reader.result;
                    };
                    reader.readAsDataURL(file);
                });
            };

            const handleAddFolder = (e) => {
                e.preventDefault();
                if (!judul.trim() || newFolderFotos.length === 0) {

                    return;
                }

                const newFolder = {
                    id: 'd_' + Date.now(),
                    judul: judul.trim(),
                    tanggal: new Date().toLocaleDateString('id-ID', { day: 'numeric', month: 'short', year: 'numeric' }),
                    fotoList: newFolderFotos
                };

                const updated = [newFolder, ...dokumentasi];
                setDokumentasi(updated);
                syncToDatabase({ dokumentasi: updated });
                showToast(`Folder Album "${judul}" (${newFolderFotos.length} foto) berhasil dibuat!`);
                setJudul(''); 
                setNewFolderFotos([]);
                if (newFileInputRef.current) newFileInputRef.current.value = '';
            };

            const handleDeleteFolder = (id) => {
                const updated = dokumentasi.filter(d => d.id !== id);

                syncToDatabase({ dokumentasi: updated });
                showToast("Folder album dokumentasi berhasil dihapus.");
            };

            const handleAddPhotoToFolder = (folderId) => {
                if (extraFotos.length === 0) {
                    showToast("Pilih foto tambahan terlebih dahulu!");
                    return;
                }
                const updated = dokumentasi.map(d => {
                    if (d.id === folderId) {
                        const existingList = d.fotoList || (d.foto ? [d.foto] : []);
                        return { ...d, fotoList: [...existingList, ...extraFotos] };
                    }
                    return d;
                });
                setDokumentasi(updated);
                syncToDatabase({ dokumentasi: updated });
                setAddPhotoTargetId(null);
                setExtraFotos([]);
                showToast("Foto berhasil ditambahkan ke folder album!");
            };

            const handleDeletePhotoFromFolder = (folderId, photoIdx) => {
                const updated = dokumentasi.map(d => {
                    if (d.id === folderId) {
                        const existingList = d.fotoList || (d.foto ? [d.foto] : []);
                        const newList = existingList.filter((_, idx) => idx !== photoIdx);
                        return { ...d, fotoList: newList };
                    }
                    return d;
                });
                setDokumentasi(updated);
                syncToDatabase({ dokumentasi: updated });
                showToast("Foto berhasil dihapus dari folder.");
            };

                <div className="space-y-6">

                        <p className="text-xs text-slate-400 mb-4">Pilih file foto dari perangkat Anda (bisa memilih banyak foto sekaligus untuk satu folder album).</p>

                        <form onSubmit={handleAddFolder} className="space-y-4 text-sm">
                            <div>
                                <label className="text-slate-400 text-xs mb-1 block font-semibold">Nama Folder / Judul Kegiatan</label>
                                <input type="text" value={judul} onChange={(e) => setJudul(e.target.value)} placeholder="Contoh: Haflah Akhirussanah 2026" className="w-full bg-slate-700 border border-slate-600 rounded-lg p-2.5 text-white focus:outline-none focus:border-sg-green" required />
                            </div>
                            <div>
                                <label className="text-slate-400 text-xs mb-1 block font-semibold">Pilih File Foto (Bisa Pilih Banyak Sekaligus)</label>
                                <input 
                                    ref={newFileInputRef}
                                    type="file" 
                                    accept="image/*" 
                                    multiple
                                    onChange={(e) => {
                                        handleFilesToDataUrls(e.target.files, (urls) => {
                                            setNewFolderFotos(urls);
                                            showToast(`${urls.length} foto berhasil dimuat.`);
                                        });
                                    }} 
                                    className="w-full bg-slate-700 border border-slate-600 rounded-lg p-2.5 text-white text-xs file:mr-4 file:py-2 file:px-4 file:rounded-lg file:border-0 file:text-xs file:font-semibold file:bg-sg-green file:text-white hover:file:bg-sg-dark cursor-pointer" 
                                    required 
                                />
                            </div>
                            {newFolderFotos.length > 0 && (
                                <div className="grid grid-cols-3 sm:grid-cols-6 gap-2 bg-slate-900 p-3 rounded-xl border border-slate-700">
                                    {newFolderFotos.map((u, i) => (
                                        <img key={i} src={u} alt="" className="w-full h-16 object-cover rounded-lg border border-slate-600" />
                                    ))}
                                </div>
                            )}
                            <button type="submit" className="w-full bg-sg-green hover:bg-sg-dark text-white font-bold py-3 rounded-xl transition shadow-md flex items-center justify-center gap-2">
                                <i className="fa-solid fa-folder-plus"></i> Simpan Folder Album Foto
                            </button>
                        </form>
                    </div>

                    <div className="bg-slate-800 p-6 rounded-2xl border border-slate-700 shadow-xl">
                        <h3 className="text-lg font-bold text-white mb-4">Daftar Folder Album Kegiatan Aktif</h3>
                        {dokumentasi.length === 0 ? (
                            <p className="text-xs text-slate-400 italic">Belum ada folder album dokumentasi.</p>
                        ) : (
                            <div className="space-y-4">
                                {dokumentasi.map(d => {
                                    const list = d.fotoList || (d.foto ? [d.foto] : []);
                                    return (
                                        <div key={d.id} className="bg-slate-700 p-4 rounded-xl border border-slate-600 space-y-3">
                                            <div className="flex flex-wrap justify-between items-center gap-2">
                                                <div className="flex items-center gap-3">
                                                    <div className="w-10 h-10 bg-emerald-500/20 text-emerald-300 rounded-xl flex items-center justify-center text-lg">
                                                        <i className="fa-solid fa-folder-closed"></i>
                                                    </div>
                                                    <div>
                                                        <h4 className="font-bold text-white text-sm">{d.judul}</h4>
                                                        <span className="text-[10px] text-slate-300">{d.tanggal} • <strong className="text-emerald-400">{list.length} Foto</strong></span>

                                                    <button onClick={() => { setAddPhotoTargetId(addPhotoTargetId === d.id ? null : d.id); setExtraFotos([]); }} className="bg-sky-600 hover:bg-sky-500 text-white text-xs px-3 py-1.5 rounded-lg transition font-medium flex items-center gap-1">
                                                        <i className="fa-solid fa-plus"></i> Tambah Foto

                                                    <button onClick={() => handleDeleteFolder(d.id)} className="bg-red-500/20 text-red-300 p-2 rounded-lg hover:bg-red-500 hover:text-white transition">

                if (file) {
                    const reader = new FileReader();
                    reader.onloadend = () => {
                        const img = new Image();
                        img.onload = () => {
                            const canvas = document.createElement('canvas');
                            const MAX_WIDTH = 300, MAX_HEIGHT = 300;
                            let width = img.width, height = img.height;
                            if (width > height) {
                                if (width > MAX_WIDTH) { height *= MAX_WIDTH / width; width = MAX_WIDTH; }
                            } else {
                                if (height > MAX_HEIGHT) { width *= MAX_HEIGHT / height; height = MAX_HEIGHT; }
                            }
                            canvas.width = width; canvas.height = height;
                            const ctx = canvas.getContext('2d');
                            ctx.drawImage(img, 0, 0, width, height);
                            setLogoUrl(canvas.toDataURL('image/jpeg', 0.6));
                        };
                        img.src = reader.result;
                    };
                    reader.readAsDataURL(file);
                }
            };

                setLogoUrl("");
                setCustomLogo("");
                syncToDatabase({ customLogo: "" });

                        foto: foto.trim() ? foto.trim() : defaultFoto,
                        nilai: [{ id: 'n1', kategori: 'Pondok', mapel: "Al-Qur'an", nilai: 85, keterangan: 'Semester Ganjil' }],
                        absensi: [{ id: 'a1', kategori: 'Pondok', tanggal: new Date().toLocaleDateString('id-ID', { day: 'numeric', month: 'long', year: 'numeric' }), status: 'Hadir', keterangan: 'Masuk Pondok' }],
                        pembayaran: [{ id: 'b1', bulan: 'Juli 2026', status: 'Belum', nominal: 'Rp300.000' }],
                        perizinan: []
                    };
                    const updated = [newSantri, ...studentsList];
                    setStudentsList(updated);
                    syncToDatabase({ studentsList: updated });
                    showToast(`Santri ${nama.trim()} berhasil ditambahkan!`);
                    setNama(''); setNis(''); setNamaWali(''); setNoHpWali(''); setFoto('');
                } catch(err) {
                    showToast("Gagal! NIS mungkin sudah terdaftar di server keamanan.");
                }
            };

            const handleUpdateStudent = (id) => {
                const cleanNis = editNis.trim().toLowerCase();
                if (!editNama.trim() || !cleanNis) {
                    showToast("Nama dan NIS wajib diisi!");
                    return;
                }
                const updated = studentsList.map(s => s.id === id ? {
                    ...s,
                    nama: editNama.trim(),
                    nis: cleanNis,
                    kelas: editKelas.trim(),
                    kamar: editKamar.trim(),
                    namaWali: editNamaWali.trim(),
                    noHpWali: editNoHpWali.trim()
                } : s);
                setStudentsList(updated);
                syncToDatabase({ studentsList: updated });
                setEditingStudentId(null);
                showToast("Data santri berhasil diperbarui!");
            };

            const handleDeleteSantri = (id) => {
                if (studentsList.length <= 1) {
                    showToast("Minimal harus ada 1 data santri!");
                    return;
                }
                const updated = studentsList.filter(s => s.id !== id);
                setStudentsList(updated);
                syncToDatabase({ studentsList: updated });
                showToast("Data santri berhasil dihapus.");
            };

            const handleResetPassword = async (santriId, santriNis) => {
                const updated = studentsList.map(s => {
                    if (s.id === santriId) {
                        return { ...s, sandi: '123456' };
                    }
                    return s;
                });
                setStudentsList(updated);
                syncToDatabase({ studentsList: updated });
                if (santriNis) {
                    try {
                        await window.FB.set(window.FB.ref(window.FB.db, `siwasgj_reset_requests/${santriNis}`), null);
                    } catch (e) {}
                }
                showToast("Sandi database direset ke '123456' (Jika wali pernah mengganti sandi sendiri, ubah juga di menu Auth Firebase Console!)");
            };

            const handleUpdateFotoFile = (santriId, e) => {
                const file = e.target.files[0];
                if (file) {
                    const reader = new FileReader();
                    reader.onloadend = () => {
                        const img = new Image();
                        img.onload = () => {
                            const canvas = document.createElement('canvas');
                            const MAX = 300;
                            let w = img.width, h = img.height;
                            if (w > h) { if (w > MAX) { h *= MAX / w; w = MAX; } }
                            else { if (h > MAX) { w *= MAX / h; h = MAX; } }
                            canvas.width = w; canvas.height = h;
                            const ctx = canvas.getContext('2d');
                            ctx.drawImage(img, 0, 0, w, h);
                            const compressedData = canvas.toDataURL('image/jpeg', 0.6);
                            const updated = studentsList.map(s => {
                                if (s.id === santriId) {
                                    return { ...s, foto: compressedData };
                                }
                                return s;
                            });
                            setStudentsList(updated);
                            syncToDatabase({ studentsList: updated });
                            showToast("Foto santri berhasil diperbarui dan dikompresi!");
                        };
                        img.src = reader.result;
                    };
                    reader.readAsDataURL(file);
                }
            };

            return (
                <div className="space-y-6">
                    {resetRequests.length > 0 && (
                        <div className="bg-amber-500/15 border border-amber-500/40 p-4 rounded-2xl space-y-2.5">
                            <h4 className="text-xs font-bold text-amber-300 flex items-center gap-2">
                                <i className="fa-solid fa-bell animate-bounce"></i> Permintaan Reset Sandi dari Wali Santri ({resetRequests.length})
                            </h4>
                            <div className="space-y-2">
                                {resetRequests.map((req, i) => (
                                    <div key={i} className="bg-slate-800/90 p-3 rounded-xl border border-slate-700 flex flex-wrap items-center justify-between gap-2 text-xs">
                                        <div>
                                            <span className="font-bold text-white">NIS: {req.nis}</span>
                                            {req.nama && req.nama !== '-' && <span className="text-slate-300"> ({req.nama})</span>}
                                            <span className="text-[10px] text-slate-400 block">Diajukan: {req.waktu}</span>
                                        </div>
                                        <button
                                            onClick={() => handleDismissResetReq(req.nis)}
                                            className="bg-emerald-600 hover:bg-emerald-500 text-white text-[11px] px-3 py-1.5 rounded-lg font-bold transition">
                                            Tandai Selesai
                                        </button>
                                    </div>
                                ))}
                            </div>
                        </div>
                    )}
                    <div className="bg-slate-800 p-6 rounded-2xl border border-slate-700 shadow-xl">
                        <h3 className="text-lg font-bold text-white mb-4 flex items-center gap-2">
                            <i className="fa-solid fa-user-plus text-sg-green"></i> Tambah Santri Baru & Data Akademik
                        </h3>
                        <form onSubmit={handleAddSantri} className="grid grid-cols-1 sm:grid-cols-2 gap-4 text-sm">
                            <div>
                                <label className="text-slate-400 text-xs mb-1 block">Nama Lengkap Santri</label>
                                <input type="text" value={nama} onChange={(e) => setNama(e.target.value)} placeholder="Contoh: Ahmad Fauzi" className="w-full bg-slate-700 border border-slate-600 rounded-lg p-2.5 text-white focus:outline-none focus:border-sg-green" required />
                            </div>
                            <div>
                                <label className="text-slate-400 text-xs mb-1 block">Nomor Induk Santri (NIS)</label>
                                <input type="text" value={nis} onChange={(e) => setNis(e.target.value.toLowerCase())} placeholder="Contoh: 123459" className="w-full bg-slate-700 border border-slate-600 rounded-lg p-2.5 text-white focus:outline-none focus:border-sg-green" required />
                            </div>
                            <div>
                                <label className="text-slate-400 text-xs mb-1 block">Kata Sandi (Password Login Wali)</label>
                                <input type="text" value={sandi} onChange={(e) => setSandi(e.target.value)} placeholder="Default: 123456" className="w-full bg-slate-700 border border-slate-600 rounded-lg p-2.5 text-white focus:outline-none focus:border-sg-green" required />
                            </div>
                            <div>
                                <label className="text-slate-400 text-xs mb-1 block">Foto Santri (Pilih File)</label>
                                <input 
                                    type="file" 
                                    accept="image/*"
                                    onChange={(e) => {
                                        const f = e.target.files[0];
                                        if (f) {
                                            const r = new FileReader();
                                            r.onloadend = () => {
                                                const img = new Image();
                                                img.onload = () => {
                                                    const canvas = document.createElement('canvas');
                                                    const MAX = 300;
                                                    let w = img.width, h = img.height;
                                                    if (w > h) { if (w > MAX) { h *= MAX / w; w = MAX; } }
                                                    else { if (h > MAX) { w *= MAX / h; h = MAX; } }
                                                    canvas.width = w; canvas.height = h;
                                                    const ctx = canvas.getContext('2d');
                                                    ctx.drawImage(img, 0, 0, w, h);
                                                    setFoto(canvas.toDataURL('image/jpeg', 0.6));
                                                };
                                                img.src = r.result;
                                            };
                                            r.readAsDataURL(f);
                                        }
                                    }}
                                    className="w-full bg-slate-700 border border-slate-600 rounded-lg p-2 text-white text-xs file:mr-2 file:py-1 file:px-3 file:rounded file:border-0 file:text-xs file:bg-sg-green file:text-white cursor-pointer" 
                                />
                            </div>
                            <div>
                                <label className="text-slate-400 text-xs mb-1 block">Kelas & Kamar</label>
                                <div className="grid grid-cols-2 gap-2">
                                    <input type="text" value={kelas} onChange={(e) => setKelas(e.target.value)} placeholder="VIII A" className="bg-slate-700 border border-slate-600 rounded-lg p-2.5 text-white text-xs" required />
                                    <input type="text" value={kamar} onChange={(e) => setKamar(e.target.value)} placeholder="Kamar 3" className="bg-slate-700 border border-slate-600 rounded-lg p-2.5 text-white text-xs" required />
                                </div>
                            </div>
                            <div>
                                <label className="text-slate-400 text-xs mb-1 block">Nama Wali & No HP</label>
                                <div className="grid grid-cols-2 gap-2">
                                    <input type="text" value={namaWali} onChange={(e) => setNamaWali(e.target.value)} placeholder="Nama Wali" className="bg-slate-700 border border-slate-600 rounded-lg p-2.5 text-white text-xs" />
                                    <input type="text" value={noHpWali} onChange={(e) => setNoHpWali(e.target.value)} placeholder="No HP" className="bg-slate-700 border border-slate-600 rounded-lg p-2.5 text-white text-xs" />
                                </div>
                            </div>
                            <div className="sm:col-span-2 pt-2">
                                <button type="submit" className="w-full bg-sg-green hover:bg-sg-dark text-white font-bold py-3 rounded-xl transition shadow-md">
                                    Simpan & Tambahkan Santri Baru
                                </button>
                            </div>
                        </form>
                    </div>

                    <div className="bg-slate-800 p-6 rounded-2xl border border-slate-700 shadow-xl">
                        <h3 className="text-lg font-bold text-white mb-4">Daftar Semua Santri, Edit Data, Foto & Sandi</h3>
                        <div className="space-y-4 max-h-[500px] overflow-y-auto pr-2">
                            {studentsList.map(s => (
                                <div key={s.id} className="bg-slate-700 p-4 rounded-xl border border-slate-600 space-y-3">
                                    {editingStudentId === s.id ? (
                                        <div className="space-y-3">
                                            <h4 className="text-xs font-bold text-emerald-400 uppercase tracking-wide">Edit Data Santri: {s.nama}</h4>
                                            <div className="grid grid-cols-1 sm:grid-cols-2 gap-3 text-xs">
                                                <div>
                                                    <label className="text-slate-300 block mb-1">Nama Lengkap</label>
                                                    <input type="text" value={editNama} onChange={(e) => setEditNama(e.target.value)} className="w-full bg-slate-800 text-white p-2.5 rounded border border-slate-500" />
                                                </div>
                                                <div>
                                                    <label className="text-slate-300 block mb-1">Nomor Induk (NIS)</label>
                                                    <input type="text" value={editNis} onChange={(e) => setEditNis(e.target.value)} className="w-full bg-slate-800 text-white p-2.5 rounded border border-slate-500" />
                                                </div>
                                                <div>
                                                    <label className="text-slate-300 block mb-1">Kelas</label>
                                                    <input type="text" value={editKelas} onChange={(e) => setEditKelas(e.target.value)} className="w-full bg-slate-800 text-white p-2.5 rounded border border-slate-500" />
                                                </div>
                                                <div>
                                                    <label className="text-slate-300 block mb-1">Kamar</label>
                                                    <input type="text" value={editKamar} onChange={(e) => setEditKamar(e.target.value)} className="w-full bg-slate-800 text-white p-2.5 rounded border border-slate-500" />
                                                </div>
                                                <div>
                                                    <label className="text-slate-300 block mb-1">Nama Wali</label>
                                                    <input type="text" value={editNamaWali} onChange={(e) => setEditNamaWali(e.target.value)} className="w-full bg-slate-800 text-white p-2.5 rounded border border-slate-500" />
                                                </div>
                                                <div>
                                                    <label className="text-slate-300 block mb-1">No HP Wali</label>
                                                    <input type="text" value={editNoHpWali} onChange={(e) => setEditNoHpWali(e.target.value)} className="w-full bg-slate-800 text-white p-2.5 rounded border border-slate-500" />
                                                </div>
                                            </div>
                                            <div className="flex gap-2 justify-end pt-2">
                                                <button onClick={() => handleUpdateStudent(s.id)} className="bg-sg-green text-white text-xs px-4 py-2 rounded-lg font-bold">Simpan Perubahan</button>
                                                <button onClick={() => setEditingStudentId(null)} className="bg-slate-600 text-slate-200 text-xs px-3 py-2 rounded-lg">Batal</button>
                                            </div>
                                        </div>
                                    ) : (
                                        <div className="flex flex-col sm:flex-row justify-between items-start sm:items-center gap-3">
                                            <div className="flex items-center gap-3">
                                                <img src={s.foto} alt="" className="w-14 h-14 rounded-full object-cover border-2 border-emerald-500/40 flex-shrink-0" />
                                                <div>
                                                    <h4 className="font-bold text-white text-sm">{s.nama}</h4>
                                                    <p className="text-xs text-slate-300">NIS: <strong className="text-emerald-400">{s.nis}</strong> | Sandi: <span className="bg-slate-800 px-1.5 py-0.5 rounded text-amber-300">{s.sandi || '123456'}</span></p>
                                                    <p className="text-[10px] text-slate-400">Kelas: {s.kelas} • Kamar: {s.kamar} • Wali: {s.namaWali} ({s.noHpWali})</p>
                                                </div>
                                            </div>

                                            <div className="w-full sm:w-auto space-y-2">
                                                <div className="flex items-center gap-2 justify-end flex-wrap">
                                                    <button onClick={() => {
                                                        setEditingStudentId(s.id);
                                                        setEditNama(s.nama);
                                                        setEditNis(s.nis);
                                                        setEditKelas(s.kelas);
                                                        setEditKamar(s.kamar);
                                                        setEditNamaWali(s.namaWali);
                                                        setEditNoHpWali(s.noHpWali);
                                                    }} className="bg-sky-600 hover:bg-sky-500 text-white text-xs px-3 py-2 rounded-lg transition font-semibold flex items-center gap-1.5">
                                                        <i className="fa-solid fa-pen-to-square"></i> Edit
                                                    </button>
                                                    <label className="bg-teal-600 hover:bg-teal-500 text-white text-xs px-3 py-2 rounded-lg transition flex items-center gap-1.5 cursor-pointer">
                                                        <i className="fa-solid fa-camera"></i> Foto
                                                        <input type="file" accept="image/*" onChange={(e) => handleUpdateFotoFile(s.id, e)} className="hidden" />
                                                    </label>
                                                    <button 
                                                        onClick={() => handleResetPassword(s.id, s.nis)}
                                                        className="bg-amber-600 hover:bg-amber-500 text-white text-xs px-3 py-2 rounded-lg transition font-semibold flex items-center gap-1" title="Reset sandi ke 123456 (Jika wali lupa)">
                                                        <i className="fa-solid fa-key"></i> Reset Sandi
                                                    </button>
                                                    <button 
                                                        onClick={() => handleDeleteSantri(s.id)}
                                                        className="bg-red-600 hover:bg-red-500 text-white text-xs px-3 py-2 rounded-lg transition">
                                                        <i className="fa-solid fa-trash"></i>
                                                    </button>
                                                </div>
                                            </div>
                                        </div>
                                    )}
                                </div>
                            ))}
                        </div>
                    </div>
                </div>
            );
        };

        const OperatorNilaiManager = ({ studentsList, setStudentsList, syncToDatabase, showToast, adminUser }) => {
            const userRole = adminUser?.role || 'superadmin';
            const lockedKategori = userRole === 'guru_smp' ? 'SMP' : userRole === 'guru_smk' ? 'SMK' : null;

            const [kategoriNilai, setKategoriNilai] = useState(lockedKategori || 'Pondok');
            const [filterJenjangSantri, setFilterJenjangSantri] = useState(lockedKategori || 'Semua');
            const [searchSantri, setSearchSantri] = useState('');
            const [selectedStudentId, setSelectedStudentId] = useState(studentsList[0]?.id || '');
            const [mapelBaru, setMapelBaru] = useState('');
            const [nilaiBaru, setNilaiBaru] = useState('');
            const [keteranganBaru, setKeteranganBaru] = useState('');
            const [filterKategoriList, setFilterKategoriList] = useState(lockedKategori || 'Semua');

            const detectJenjang = (kelas = '') => {
                const k = kelas.toUpperCase().trim();
                if (k.startsWith('X') || k.includes('SMK') || k.startsWith('10') || k.startsWith('11') || k.startsWith('12')) return 'SMK';
                if (k.startsWith('VII') || k.startsWith('VIII') || k.startsWith('IX') || k.includes('SMP') || k.startsWith('7') || k.startsWith('8') || k.startsWith('9')) return 'SMP';
                return 'Lainnya';
            };

            const filteredStudents = studentsList.filter(s => {
                const jenjang = s.jenjang || detectJenjang(s.kelas);
                const matchJenjang = filterJenjangSantri === 'Semua' || jenjang === filterJenjangSantri;
                const matchQuery = !searchSantri || s.nama.toLowerCase().includes(searchSantri.toLowerCase()) || String(s.nis).includes(searchSantri.trim());
                return matchJenjang && matchQuery;
            });

            const currentStudent = filteredStudents.length > 0
                ? (filteredStudents.find(s => s.id === selectedStudentId) || filteredStudents[0])
                : null;

            const handleUpdateNilai = (nilaiId, rawScore) => {
                if (!currentStudent) return;
                const parsed = Math.max(0, Math.min(100, Number(rawScore) || 0));
                const updatedStudents = studentsList.map(s => {
                    if (s.id === currentStudent.id) {
                        const updatedNilai = (s.nilai || []).map(n => n.id === nilaiId ? { ...n, nilai: parsed } : n);
                        return { ...s, nilai: updatedNilai };
                    }
                    return s;
                });
                setStudentsList(updatedStudents);
                syncToDatabase({ studentsList: updatedStudents });
                showToast("Nilai berhasil diperbarui!");
            };

            const handleAddMapel = (e) => {
                e.preventDefault();
                if (!mapelBaru.trim() || nilaiBaru === '' || !currentStudent) return;
                const activeKategori = lockedKategori || kategoriNilai;
                const newEntry = {
                    id: 'n_' + Date.now(),
                    kategori: activeKategori,
                    mapel: mapelBaru.trim(),
                    nilai: Math.max(0, Math.min(100, Number(nilaiBaru) || 0)),
                    keterangan: keteranganBaru.trim()
                };
                const updatedStudents = studentsList.map(s => {
                    if (s.id === currentStudent.id) {
                        return { ...s, nilai: [...(s.nilai || []), newEntry] };
                    }
                    return s;
                });
                setStudentsList(updatedStudents);
                syncToDatabase({ studentsList: updatedStudents });
                showToast(`Nilai ${activeKategori} "${mapelBaru.trim()}" ditambahkan ke ${currentStudent.nama}!`);
                setMapelBaru(''); setNilaiBaru(''); setKeteranganBaru('');
            };

            const handleDeleteMapel = (nilaiId) => {
                if (!currentStudent) return;
                const updatedStudents = studentsList.map(s => {
                    if (s.id === currentStudent.id) {
                        return { ...s, nilai: (s.nilai || []).filter(n => n.id !== nilaiId) };
                    }
                    return s;
                });
                setStudentsList(updatedStudents);
                syncToDatabase({ studentsList: updatedStudents });
                showToast("Mata pelajaran berhasil dihapus.");
            };

            const activeKat = lockedKategori || kategoriNilai;
            const displayedNilai = currentStudent
                ? (currentStudent.nilai || []).filter(n => {
                    const kat = n.kategori || 'Pondok';
                    return filterKategoriList === 'Semua' || kat === filterKategoriList;
                })
                : [];
            const avgNilai = displayedNilai.length > 0
                ? (displayedNilai.reduce((sum, n) => sum + (Number(n.nilai) || 0), 0) / displayedNilai.length).toFixed(1)
                : '-';

            return (
                <div className="space-y-6">
                    <div className="bg-slate-800 p-6 rounded-2xl border border-slate-700 shadow-xl">
                        <h3 className="text-lg font-bold text-white mb-2 flex items-center gap-2">
                            <i className="fa-solid fa-book-open text-sg-green"></i> Kelola Nilai Pondok, SMP & SMK
                        </h3>
                        <p className="text-xs text-slate-400 mb-4">Input dan perbarui nilai mata pelajaran kitab/diniyah Pondok maupun pelajaran sekolah formal (SMP / SMK) secara real-time.</p>

                        <div className="mb-4">
                            <label className="text-xs text-slate-300 block mb-1.5 font-semibold">Pilih Lembaga / Kategori Nilai</label>
                            <div className="grid grid-cols-3 gap-2 bg-slate-900 p-1.5 rounded-xl border border-slate-700">
                                {['Pondok', 'SMP', 'SMK'].map(kat => {
                                    const disabled = lockedKategori && lockedKategori !== kat;
                                    const active = activeKat === kat;
                                    return (
                                        <button
                                            key={kat}
                                            type="button"
                                            disabled={disabled}
                                            onClick={() => {
                                                setKategoriNilai(kat);
                                                setFilterKategoriList(kat);
                                                if (kat === 'SMP' || kat === 'SMK') setFilterJenjangSantri(kat);
                                                else setFilterJenjangSantri('Semua');
                                            }}
                                            className={`py-2.5 rounded-lg text-xs font-bold transition ${
                                                disabled ? 'opacity-30 cursor-not-allowed text-slate-500' :
                                                active
                                                    ? kat === 'Pondok' ? 'bg-sg-green text-white shadow'
                                                    : kat === 'SMP' ? 'bg-sky-600 text-white shadow'
                                                    : 'bg-purple-600 text-white shadow'
                                                    : 'text-slate-300 hover:bg-slate-800'
                                            }`}>
                                            {kat === 'Pondok' ? 'Pondok Pesantren' : `Sekolah ${kat}`}
                                        </button>
                                    );
                                })}
                            </div>
                        </div>

                        <div className="grid grid-cols-1 sm:grid-cols-3 gap-3 mb-4">
                            <div>
                                <label className="text-xs text-slate-300 block mb-1 font-semibold">Filter Jenjang Santri</label>
                                <select
                                    value={filterJenjangSantri}
                                    onChange={(e) => setFilterJenjangSantri(e.target.value)}
                                    className="w-full bg-slate-700 border border-slate-600 rounded-xl p-2.5 text-white text-xs">
                                    <option value="Semua">Semua Santri</option>
                                    <option value="SMP">Santri SMP (Kls VII–IX)</option>
                                    <option value="SMK">Santri SMK (Kls X–XII)</option>
                                </select>
                            </div>
                            <div className="sm:col-span-2">
                                <label className="text-xs text-slate-300 block mb-1 font-semibold">Cari Nama / NIS Santri</label>
                                <input
                                    type="text"
                                    value={searchSantri}
                                    onChange={(e) => setSearchSantri(e.target.value)}
                                    placeholder="Ketik nama santri atau NIS..."
                                    className="w-full bg-slate-700 border border-slate-600 rounded-xl p-2.5 text-white text-xs"
                                />
                            </div>
                        </div>

                        {!currentStudent ? (
                            <div className="bg-amber-500/10 border border-amber-500/30 rounded-xl p-4 text-xs text-amber-300 text-center">
                                Tidak ada data santri yang cocok dengan filter / pencarian saat ini. Ubah filter jenjang ke <strong>Semua Santri</strong> atau bersihkan kolom pencarian.
                            </div>
                        ) : (
                            <React.Fragment>
                                <div className="mb-4">
                                    <label className="text-xs text-slate-300 block mb-1 font-semibold">Pilih Santri ({filteredStudents.length} santri)</label>
                                    <select 
                                        value={currentStudent.id} 
                                        onChange={(e) => setSelectedStudentId(e.target.value)}

        const OperatorAbsensiManager = ({ studentsList, setStudentsList, syncToDatabase, showToast, adminUser }) => {
            const userRole = adminUser?.role || 'superadmin';
            const lockedKategori = userRole === 'absensi_smp' ? 'SMP' : userRole === 'absensi_smk' ? 'SMK' : null;

            const [kategoriAbsen, setKategoriAbsen] = useState(lockedKategori || 'Pondok');
            const [filterJenjangSantri, setFilterJenjangSantri] = useState(lockedKategori || 'Semua');
            const [searchSantri, setSearchSantri] = useState('');
            const [selectedStudentId, setSelectedStudentId] = useState(studentsList[0]?.id || '');
            const [tanggalAbsen, setTanggalAbsen] = useState(new Date().toLocaleDateString('id-ID', { day: 'numeric', month: 'long', year: 'numeric' }));
            const [statusAbsen, setStatusAbsen] = useState('Hadir');
            const [keteranganAbsen, setKeteranganAbsen] = useState('');
            const [filterRiwayat, setFilterRiwayat] = useState(lockedKategori || 'Semua');

            const detectJenjang = (kelas = '') => {
                const k = kelas.toUpperCase().trim();
                if (k.startsWith('X') || k.includes('SMK') || k.startsWith('10') || k.startsWith('11') || k.startsWith('12')) return 'SMK';
                if (k.startsWith('VII') || k.startsWith('VIII') || k.startsWith('IX') || k.includes('SMP') || k.startsWith('7') || k.startsWith('8') || k.startsWith('9')) return 'SMP';
                return 'Lainnya';
            };

            const filteredStudents = studentsList.filter(s => {
                const jenjang = s.jenjang || detectJenjang(s.kelas);
                const matchJenjang = filterJenjangSantri === 'Semua' || jenjang === filterJenjangSantri;
                const matchQuery = !searchSantri || s.nama.toLowerCase().includes(searchSantri.toLowerCase()) || String(s.nis).includes(searchSantri.trim());
                return matchJenjang && matchQuery;
            });

            const currentStudent = filteredStudents.length > 0
                ? (filteredStudents.find(s => s.id === selectedStudentId) || filteredStudents[0])
                : null;

            const handleAddAbsensi = (e) => {
                e.preventDefault();
                if (!tanggalAbsen.trim() || !currentStudent) return;
                const activeKategori = lockedKategori || kategoriAbsen;
                const newAbsen = {
                    id: 'a_' + Date.now(),
                    kategori: activeKategori,
                    tanggal: tanggalAbsen.trim(),
                    status: statusAbsen,
                    keterangan: keteranganAbsen.trim()
                };
                const updatedStudents = studentsList.map(s => {
                    if (s.id === currentStudent.id) {
                        return { ...s, absensi: [newAbsen, ...(s.absensi || [])] };
                    }
                    return s;
                });
                setStudentsList(updatedStudents);
                syncToDatabase({ studentsList: updatedStudents });
                setKeteranganAbsen('');
                showToast(`Absensi ${activeKategori} (${statusAbsen}) untuk ${currentStudent.nama} berhasil dicatat!`);
            };

            const handleDeleteAbsensi = (absenId) => {
                if (!currentStudent) return;
                const updatedStudents = studentsList.map(s => {
                    if (s.id === currentStudent.id) {
                        return { ...s, absensi: (s.absensi || []).filter(a => a.id !== absenId) };
                    }
                    return s;
                });
                setStudentsList(updatedStudents);
                syncToDatabase({ studentsList: updatedStudents });
                showToast("Catatan absensi dihapus.");
            };

            const riwayatList = currentStudent
                ? (currentStudent.absensi || []).filter(a => {
                    const kat = a.kategori || 'Pondok';
                    return filterRiwayat === 'Semua' || kat === filterRiwayat;
                })
                : [];

            return (
                <div className="space-y-6">
                    <div className="bg-slate-800 p-6 rounded-2xl border border-slate-700 shadow-xl">
                        <h3 className="text-lg font-bold text-white mb-2 flex items-center gap-2">
                            <i className="fa-solid fa-calendar-check text-sg-green"></i> Kelola Absensi Pondok, SMP & SMK
                        </h3>
                        <p className="text-xs text-slate-400 mb-4">Catat kehadiran santri pada kegiatan Pondok maupun sekolah formal (SMP / SMK) secara real-time.</p>

                            <label className="text-xs text-slate-300 block mb-1.5 font-semibold">Pilih Lembaga / Kategori Absensi</label>

                                {['Pondok', 'SMP', 'SMK'].map(kat => {
                                    const disabled = lockedKategori && lockedKategori !== kat;
                                    const active = (lockedKategori || kategoriAbsen) === kat;
                                    return (
                                        <button
                                            key={kat}
                                            type="button"
                                            disabled={disabled}
                                            onClick={() => {
                                                setKategoriAbsen(kat);
                                                setFilterRiwayat(kat);
                                                if (kat === 'SMP' || kat === 'SMK') setFilterJenjangSantri(kat);
                                                else setFilterJenjangSantri('Semua');
                                            }}

                                                disabled ? 'opacity-30 cursor-not-allowed text-slate-500' :
                                                active
                                                    ? kat === 'Pondok' ? 'bg-sg-green text-white shadow'
                                                    : kat === 'SMP' ? 'bg-sky-600 text-white shadow'
                                                    : 'bg-purple-600 text-white shadow'
                                                    : 'text-slate-300 hover:bg-slate-800'
                                            }`}>
                                            {kat === 'Pondok' ? 'Pondok Pesantren' : `Sekolah ${kat}`}
                                        </button>
                                    );
                                })}
                            </div>
                        </div>

                        <div className="grid grid-cols-1 sm:grid-cols-3 gap-3 mb-4">
                            <div>
                                <label className="text-xs text-slate-300 block mb-1 font-semibold">Filter Jenjang Santri</label>
                                <select
                                    value={filterJenjangSantri}
                                    onChange={(e) => setFilterJenjangSantri(e.target.value)}
                                    className="w-full bg-slate-700 border border-slate-600 rounded-xl p-2.5 text-white text-xs">
                                    <option value="Semua">Semua Santri</option>
                                    <option value="SMP">Santri SMP (Kls VII–IX)</option>
                                    <option value="SMK">Santri SMK (Kls X–XII)</option>
                                </select>
                            </div>
                            <div className="sm:col-span-2">
                                <label className="text-xs text-slate-300 block mb-1 font-semibold">Cari Nama / NIS Santri</label>
                                <input
                                    type="text"
                                    value={searchSantri}
                                    onChange={(e) => setSearchSantri(e.target.value)}
                                    placeholder="Ketik nama santri atau NIS..."
                                    className="w-full bg-slate-700 border border-slate-600 rounded-xl p-2.5 text-white text-xs"
                                />
                            </div>
                        </div>

                        {!currentStudent ? (
                            <div className="bg-amber-500/10 border border-amber-500/30 rounded-xl p-4 text-xs text-amber-300 text-center">
                                Tidak ada data santri yang cocok dengan filter / pencarian saat ini. Ubah filter jenjang ke <strong>Semua Santri</strong> atau bersihkan kolom pencarian.
                            </div>
                        ) : (
                            <React.Fragment>
                                <div className="mb-4">
                                    <label className="text-xs text-slate-300 block mb-1 font-semibold">Pilih Santri ({filteredStudents.length} santri)</label>
                                    <select 
                                        value={currentStudent.id} 
                                        onChange={(e) => setSelectedStudentId(e.target.value)}
                                        className="w-full bg-slate-700 border border-slate-600 rounded-xl p-3 text-white text-sm focus:outline-none focus:border-sg-green">
                                        {filteredStudents.map(s => (
                                            <option key={s.id} value={s.id}>
                                                {s.nama} (NIS: {s.nis} • Kelas {s.kelas} • Kamar {s.kamar})
                                            </option>
                                        ))}
                                    </select>
                                </div>

                                <form onSubmit={handleAddAbsensi} className="bg-slate-700/50 p-4 rounded-xl border border-slate-600 mb-6 space-y-3">
                                    <h4 className="text-xs font-bold text-emerald-400 uppercase tracking-wide">
                                        Catat Absensi {lockedKategori || kategoriAbsen} — {currentStudent.nama}
                                    </h4>
                                    <div className="grid grid-cols-1 sm:grid-cols-3 gap-3">
                                        <div>
                                            <label className="text-[11px] text-slate-300 block mb-1">Keterangan Tanggal</label>
                                            <input 
                                                type="text" 
                                                value={tanggalAbsen} 
                                                onChange={(e) => setTanggalAbsen(e.target.value)} 
                                                placeholder="Contoh: 24 November 2026" 
                                                className="w-full bg-slate-700 border border-slate-600 rounded-lg p-2.5 text-white text-xs" 
                                                required 
                                            />
                                        </div>
                                        <div>
                                            <label className="text-[11px] text-slate-300 block mb-1">Status Kehadiran</label>
                                            <select 
                                                value={statusAbsen} 
                                                onChange={(e) => setStatusAbsen(e.target.value)}
                                                className="w-full bg-slate-700 border border-slate-600 rounded-lg p-2.5 text-white text-xs">
                                                <option value="Hadir">Hadir</option>
                                                <option value="Izin">Izin</option>
                                                <option value="Sakit">Sakit</option>
                                                <option value="Alpha">Alpha / Mangkir</option>
                                            </select>
                                        </div>
                                        <div>
                                            <label className="text-[11px] text-slate-300 block mb-1">Catatan / Jam Pelajaran (Opsional)</label>
                                            <input 
                                                type="text" 
                                                value={keteranganAbsen} 
                                                onChange={(e) => setKeteranganAbsen(e.target.value)} 
                                                placeholder="Misal: Jam 1-4 / Pengajian" 
                                                className="w-full bg-slate-700 border border-slate-600 rounded-lg p-2.5 text-white text-xs" 
                                            />

                                    <button type="submit" className="w-full bg-sg-green hover:bg-sg-dark text-white text-xs font-bold py-2.5 rounded-lg transition">
                                        Simpan Absensi {lockedKategori || kategoriAbsen}
                                    </button>
                                </form>

                                <div className="flex flex-wrap items-center justify-between gap-2 mb-3">
                                    <h4 className="text-xs font-bold text-slate-300 uppercase tracking-wide">Riwayat Absensi {currentStudent.nama}</h4>
                                    <div className="flex gap-1.5">
                                        {['Semua', 'Pondok', 'SMP', 'SMK'].map(tab => (
                                            <button
                                                key={tab}
                                                type="button"
                                                onClick={() => setFilterRiwayat(tab)}
                                                className={`px-2.5 py-1 rounded-lg text-[11px] font-bold transition ${
                                                    filterRiwayat === tab ? 'bg-emerald-600 text-white' : 'bg-slate-700 text-slate-300 hover:bg-slate-600'
                                                }`}>
                                                {tab}
                                            </button>
                                        ))}
                                    </div>
                                </div>

                                <div className="space-y-2">
                                    {riwayatList.length > 0 ? (
                                        riwayatList.map(a => {
                                            const kat = a.kategori || 'Pondok';
                                            return (
                                                <div key={a.id} className="bg-slate-700 p-3.5 rounded-xl border border-slate-600 flex items-center justify-between text-sm gap-2">
                                                    <div>
                                                        <div className="flex items-center gap-2 flex-wrap">
                                                            <span className={`px-2 py-0.5 rounded text-[10px] font-bold ${
                                                                kat === 'Pondok' ? 'bg-emerald-500/20 text-emerald-300' :
                                                                kat === 'SMP' ? 'bg-sky-500/20 text-sky-300' :
                                                                'bg-purple-500/20 text-purple-300'
                                                            }`}>{kat}</span>
                                                            <span className="text-slate-200 font-medium">{a.tanggal}</span>

                                                    </div>

                                                            a.status === 'Hadir' ? 'bg-emerald-500/20 text-emerald-300' :
                                                            a.status === 'Izin' ? 'bg-amber-500/20 text-amber-300' :
                                                            a.status === 'Sakit' ? 'bg-sky-500/20 text-sky-300' : 'bg-red-500/20 text-red-300'
                                                        }`}>
                                                            {a.status}

                                                            onClick={() => handleDeleteAbsensi(a.id)}
                                                            className="bg-red-500/20 hover:bg-red-500 text-red-300 hover:text-white p-1.5 rounded-lg transition text-xs" title="Hapus Absen">

        const OperatorPembayaranManager = ({ studentsList, setStudentsList, syncToDatabase, showToast }) => {
            const [searchSantri, setSearchSantri] = useState('');
            const [selectedStudentId, setSelectedStudentId] = useState(studentsList[0]?.id || '');
            const [bulanBaru, setBulanBaru] = useState('');
            const [nominalBaru, setNominalBaru] = useState('300000');
            const [statusBaru, setStatusBaru] = useState('Belum');

            const filteredStudents = studentsList.filter(s =>
                !searchSantri || s.nama.toLowerCase().includes(searchSantri.toLowerCase()) || String(s.nis).includes(searchSantri.trim())
            );

            const currentStudent = filteredStudents.length > 0
                ? (filteredStudents.find(s => s.id === selectedStudentId) || filteredStudents[0])
                : null;

            const handleToggleStatus = (pembayaranId) => {
                if (!currentStudent) return;
                const updatedStudents = studentsList.map(s => {
                    if (s.id === currentStudent.id) {
                        const updatedPembayaran = (s.pembayaran || []).map(p => {
                            if (p.id === pembayaranId) {
                                return { ...p, status: p.status === 'Lunas' ? 'Belum' : 'Lunas' };
                            }
                            return p;
                        });
                        return { ...s, pembayaran: updatedPembayaran };
                    }
                    return s;
                });
                setStudentsList(updatedStudents);
                syncToDatabase({ studentsList: updatedStudents });
                showToast("Status tagihan keuangan berhasil diperbarui real-time!");
            };

            const handleAddTagihan = (e) => {
                e.preventDefault();
                if (!bulanBaru.trim() || !nominalBaru.trim() || !currentStudent) return;
                const numericVal = Number(nominalBaru.replace(/[^0-9]/g, ''));
                const formattedNominal = nominalBaru.trim().startsWith('Rp')
                    ? nominalBaru.trim()
                    : `Rp${(numericVal || 0).toLocaleString('id-ID')}`;
                const newTagihan = {
                    id: 'b_' + Date.now(),
                    bulan: bulanBaru.trim(),
                    status: statusBaru,
                    nominal: formattedNominal
                };
                const updatedStudents = studentsList.map(s => {
                    if (s.id === currentStudent.id) {
                        return { ...s, pembayaran: [newTagihan, ...(s.pembayaran || [])] };
                    }
                    return s;
                });
                setStudentsList(updatedStudents);
                syncToDatabase({ studentsList: updatedStudents });
                showToast(`Tagihan keuangan ${bulanBaru.trim()} ditambahkan ke ${currentStudent.nama}!`);
                setBulanBaru('');
            };

            const handleDeleteTagihan = (pembayaranId) => {
                if (!currentStudent) return;
                const updatedStudents = studentsList.map(s => {
                    if (s.id === currentStudent.id) {
                        return { ...s, pembayaran: (s.pembayaran || []).filter(p => p.id !== pembayaranId) };
                    }
                    return s;
                });
                setStudentsList(updatedStudents);
                syncToDatabase({ studentsList: updatedStudents });
                showToast("Tagihan keuangan berhasil dihapus.");
            };

            return (
                <div className="space-y-6">
                    <div className="bg-slate-800 p-6 rounded-2xl border border-slate-700 shadow-xl">
                        <h3 className="text-lg font-bold text-white mb-2 flex items-center gap-2">
                            <i className="fa-solid fa-wallet text-sg-green"></i> Kelola Keuangan, Tagihan & SPP (Bendahara)
                        </h3>
                        <p className="text-xs text-slate-400 mb-4">Pilih santri untuk mengelola rincian keuangan, tagihan bulanan, dan status pembayaran SPP secara real-time.</p>

                        <div className="mb-3">
                            <label className="text-xs text-slate-300 block mb-1 font-semibold">Cari Nama / NIS Santri</label>
                            <input
                                type="text"
                                value={searchSantri}
                                onChange={(e) => setSearchSantri(e.target.value)}
                                placeholder="Ketik nama santri atau NIS..."
                                className="w-full bg-slate-700 border border-slate-600 rounded-xl p-2.5 text-white text-xs"
                            />
                        </div>

                        {!currentStudent ? (
                            <div className="bg-amber-500/10 border border-amber-500/30 rounded-xl p-4 text-xs text-amber-300 text-center">
                                Santri tidak ditemukan. Bersihkan kata kunci pencarian di atas.
                            </div>
                        ) : (
                            <React.Fragment>
                                <div className="mb-4">
                                    <label className="text-xs text-slate-300 block mb-1 font-semibold">Pilih Santri ({filteredStudents.length} santri)</label>
                                    <select 
                                        value={currentStudent.id} 
                                        onChange={(e) => setSelectedStudentId(e.target.value)}
                                        className="w-full bg-slate-700 border border-slate-600 rounded-xl p-3 text-white text-sm focus:outline-none focus:border-sg-green">
                                        {filteredStudents.map(s => (
                                            <option key={s.id} value={s.id}>
                                                {s.nama} (NIS: {s.nis} - Kelas {s.kelas})
                                            </option>
                                        ))}

        const OperatorPerizinanManager = ({ studentsList, setStudentsList, syncToDatabase, showToast }) => {
            const handleUpdatePermissionStatus = (santriId, izinId, newStatus) => {
                const updatedStudents = studentsList.map(s => {
                    if (s.id === santriId) {
                        const updatedPerizinan = (s.perizinan || []).map(i => {
                            if (i.id === izinId) {
                                return { ...i, status: newStatus };
                            }
                            return i;
                        });
                        return { ...s, perizinan: updatedPerizinan };
                    }
                    return s;
                });
                setStudentsList(updatedStudents);
                syncToDatabase({ studentsList: updatedStudents });
                showToast(`Status perizinan diubah menjadi "${newStatus}" real-time!`);
            };

            const handleDeletePermission = (santriId, izinId) => {
                const updatedStudents = studentsList.map(s => {
                    if (s.id === santriId) {
                        return { ...s, perizinan: (s.perizinan || []).filter(i => i.id !== izinId) };
                    }
                    return s;
                });
                setStudentsList(updatedStudents);
                syncToDatabase({ studentsList: updatedStudents });
                showToast("Pengajuan izin berhasil dihapus.");
            };

            const allPermissions = [];
            studentsList.forEach(s => {
                if (s.perizinan && s.perizinan.length > 0) {
                    s.perizinan.forEach(i => {
                        allPermissions.push({ ...i, studentId: s.id, studentName: s.nama, studentClass: s.kelas });
                    });
                }
            });

            return (
                <div className="space-y-6">

                            {allPermissions.length > 0 ? (
                                allPermissions.map(item => (
                                    <div key={item.id} className="bg-slate-700 p-4 rounded-xl border border-slate-600 flex flex-col sm:flex-row justify-between items-start sm:items-center gap-4">

                                            <div className="flex items-center gap-2 flex-wrap">

                                                    {item.studentName} ({item.studentClass})

                                                <span className="text-xs font-bold text-amber-400">• {item.jenis}</span>
                                                <span className="text-[10px] text-slate-400">({item.tglPengajuan})</span>

                                            }`}>
                                                {item.status}

                                            <button 
                                                onClick={() => handleUpdatePermissionStatus(item.studentId, item.id, 'Disetujui')}

                                                <i className="fa-solid fa-check"></i> Setujui
                                            </button>
                                            <button 
                                                onClick={() => handleUpdatePermissionStatus(item.studentId, item.id, 'Ditolak')}

                                                <i className="fa-solid fa-xmark"></i> Tolak

                                            <button 
                                                onClick={() => handleDeletePermission(item.studentId, item.id)}

                                                <i className="fa-solid fa-trash"></i>
                                            </button>
                                        </div>
                                    </div>

                                </button>
                            ))}

                        <main className="flex-1 p-4 md:p-8 overflow-y-auto bg-slate-900 pb-16">

                                <OperatorPengumumanManager pengumuman={pengumuman} setPengumuman={setPengumuman} syncToDatabase={syncToDatabase} showToast={showToast} />
